	<script>
  // Auto-Reload for HTML and all linked stylesheets (No dependencies)
  (() => {
    // Gather the HTML page and all linked stylesheets
    const urls = [window.location.href];
    document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      if (link.href) urls.push(link.href);
    });

    const timestamps = {};

    setInterval(async () => {
      for (const url of urls) {
        try {
          const res = await fetch(url, { method: 'HEAD' });
          const modified = res.headers.get('last-modified');

          if (timestamps[url] && timestamps[url] !== modified) {
            window.location.reload();
            return;
          }
          timestamps[url] = modified;
        } catch (err) {
          // Suppress network errors during reload cycles
        }
      }
    }, 1000); // Checks every 1 second
  })();
</script>
