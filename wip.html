	<script>
  // Robust Auto-Reload for HTML and local stylesheets only
  (() => {
    const getUrls = () => {
      const urls = [window.location.href];
      document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
        const href = link.getAttribute('href');
        if (href) {
          // Explicitly ignore Google Fonts or any external CDNs by keyword
          if (href.includes('googleapis.com') || href.includes('cdnjs.cloudflare.com')) {
            return;
          }

          try {
            const urlObj = new URL(link.href, window.location.origin);
            // Only allow same-origin files
            if (urlObj.origin === window.location.origin) {
              urls.push(urlObj.href.split('?')[0]);
            }
          } catch (e) {
            // Skip invalid URLs
          }
        }
      });
      return urls;
    };

    const timestamps = {};

    setInterval(async () => {
      const urls = getUrls();

      for (const baseUrl of urls) {
        try {
          const cacheBustedUrl = `${baseUrl}?t=${Date.now()}`;
          const res = await fetch(cacheBustedUrl, { method: 'HEAD' });
          const modified = res.headers.get('last-modified');

          if (timestamps[baseUrl] && timestamps[baseUrl] !== modified) {
            window.location.reload();
            return;
          }
          timestamps[baseUrl] = modified;

        } catch (err) {
          // Suppress network errors during reload cycles
        }
      }
    }, 1000); // Checks every 1 second
  })();
</script>
